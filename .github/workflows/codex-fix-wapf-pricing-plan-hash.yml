name: Repair WAPF pricing plan hash

on:
  push:
    branches:
      - codex/fix-wapf-pricing-plan-hash

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-wapf-pricing-plan-hash

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact plan-hash repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/index.ts';
          const source = fs.readFileSync(path, 'utf8');
          const oldText = '\t\t\t\tconst plan = await buildWapfPricingReferencePlan(args, product);';
          const newText = [
            '\t\t\t\tconst pricingArgs = wapfPricingReferenceMigrationBase.parse(args);',
            '\t\t\t\tconst plan = await buildWapfPricingReferencePlan(pricingArgs, product);',
          ].join('\n');
          const matches = source.split(oldText).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one apply-plan call, found ${matches}.`);
          const updated = source.replace(oldText, newText);
          if (!updated.includes(newText)) throw new Error('Pricing plan repair was not applied.');
          fs.writeFileSync(path, updated);
          NODE

      - name: Assert apply-only fields are stripped
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.ts', 'utf8');
          const marker = 'server.registerTool(\n\t\t"apply_wapf_pricing_reference_migration_guarded"';
          const start = source.indexOf(marker);
          if (start < 0) throw new Error('Guarded apply registration not found.');
          const applyBlock = source.slice(start, source.indexOf('\n\t);', start) + 4);
          if (!applyBlock.includes('wapfPricingReferenceMigrationBase.parse(args)')) {
            throw new Error('Apply handler does not normalize through the preview schema.');
          }
          if (applyBlock.includes('buildWapfPricingReferencePlan(args, product)')) {
            throw new Error('Apply handler still hashes the extended apply payload.');
          }
          NODE

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save "@oxlint/binding-linux-x64-gnu@$(node -p "require('./node_modules/oxlint/package.json').version")"

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx oxlint src/index.ts

      - name: Commit validated repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-fix-wapf-pricing-plan-hash.yml
          git add src/index.ts
          git commit -m "Fix WAPF pricing migration plan hash"
          git push origin HEAD:codex/fix-wapf-pricing-plan-hash
