name: Patch ZipGrip sample cohort

on:
  push:
    branches:
      - feature/zipgrip-sample-cohort
    paths:
      - scripts/patch-zipgrip-sample-cohort-v2.mjs
      - .github/workflows/patch-zipgrip-sample-cohort.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zipgrip-sample-cohort
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/patch-zipgrip-sample-cohort-v2.mjs
      - run: npm run type-check
      - name: Remove temporary patch machinery
        run: rm -f scripts/patch-zipgrip-sample-cohort.mjs scripts/patch-zipgrip-sample-cohort-v2.mjs .github/workflows/patch-zipgrip-sample-cohort.yml package-lock.json
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add read-only ZipGrip sample-to-purchase cohort tool"
          git push origin HEAD:feature/zipgrip-sample-cohort
