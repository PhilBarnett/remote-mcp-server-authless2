name: Apply Search Console consolidation

on:
  push:
    branches:
      - refactor/search-console-consolidation

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/search-console-consolidation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic consolidation
        run: node scripts/apply-search-console-consolidation.mjs

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save "@oxlint/binding-linux-x64-gnu@$(node -p "require('./node_modules/oxlint/package.json').version")"

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx oxlint src/index.ts

      - name: Audit MCP tool surface
        run: npm run audit:mcp-tools

      - name: Commit validated source change
        run: |
          if git diff --quiet -- src/index.ts; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "Consolidate Search Console MCP tools"
          git push origin HEAD:refactor/search-console-consolidation
