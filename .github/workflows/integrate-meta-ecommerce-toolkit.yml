name: Integrate Meta Ecommerce Toolkit v1

on:
  push:
    branches:
      - feature/meta-ecommerce-toolkit-v1

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/meta-ecommerce-toolkit-v1
          fetch-depth: 0

      - name: Integrate toolkit into worker
        run: python scripts/integrate-meta-ecommerce-toolkit.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save "@oxlint/binding-linux-x64-gnu@$(node -p "require('./node_modules/oxlint/package.json').version")"

      - name: Type-check
        run: npm run type-check

      - name: Lint toolkit and worker
        run: npx oxlint src/index.ts src/meta-ecommerce-toolkit.ts

      - name: Remove temporary integration helpers
        run: |
          rm scripts/integrate-meta-ecommerce-toolkit.py
          rm .github/workflows/integrate-meta-ecommerce-toolkit.yml

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/meta-ecommerce-toolkit.ts scripts/integrate-meta-ecommerce-toolkit.py .github/workflows/integrate-meta-ecommerce-toolkit.yml
          git commit -m "Integrate guarded Meta ecommerce toolkit v1"
          git push origin HEAD:feature/meta-ecommerce-toolkit-v1
