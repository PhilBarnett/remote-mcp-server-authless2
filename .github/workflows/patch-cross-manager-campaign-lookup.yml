name: Patch cross-manager campaign lookup

on:
  push:
    branches:
      - fix/google-ads-cross-manager-campaign-lookup

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-cross-manager-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-ads-cross-manager-campaign-lookup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch source
        run: node .github/scripts/patch-cross-manager-campaign-lookup.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "Add read-only cross-manager Google Ads campaign lookup"
          git push origin HEAD:fix/google-ads-cross-manager-campaign-lookup
