name: Patch cross-manager campaign lookup

on:
  push:
    branches:
      - fix/google-ads-cross-manager-campaign-lookup

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-cross-manager-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-ads-cross-manager-campaign-lookup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch src/index.ts
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/index.ts')
          text = path.read_text()

          start = text.index('async function googleAdsSearch(query: string) {')
          end = text.index('\nasync function googleAdsMutate(', start)

          replacement = r'''async function googleAdsSearchCustomer(customerId: string, query: string) {
          if (!/^\d{10}$/.test(customerId)) {
            throw new Error("Google Ads target customer ID must contain exactly 10 digits.");
          }

          const { developerToken, loginCustomerId } = getGoogleAdsConfig();
          const accessToken = await getGoogleAdsAccessToken();
          const results: any[] = [];
          let pageToken: string | undefined;

          do {
            const response = await fetch(
              `https://googleads.googleapis.com/v25/customers/${customerId}/googleAds:search`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  "developer-token": developerToken,
                  "login-customer-id": loginCustomerId,
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify({ query, pageToken }),
              },
            );

            if (!response.ok) {
              throw new Error(
                `Google Ads API request for customer ${customerId} failed: ${response.status} ${await response.text()}`,
              );
            }

            const page = await response.json<{ results?: any[]; nextPageToken?: string }>();
            results.push(...(page.results ?? []));
            pageToken = page.nextPageToken;
          } while (pageToken && results.length < 10_000);

          return results;
        }

        async function googleAdsSearch(query: string) {
          const { customerId } = getGoogleAdsConfig();
          return googleAdsSearchCustomer(customerId, query);
        }
        '''

          text = text[:start] + replacement + text[end:]

          marker = '''\tserver.registerTool(\n\t\t"get_google_ads_summary",'''
          insert_at = text.index(marker)

          tool = r'''	server.registerTool(
          "find_google_ads_campaign_across_manager",
          {
            description:
              "Locate one or more Google Ads campaign IDs across all accessible non-manager client accounts beneath the configured manager account. Read-only diagnostic for attribution reconciliation.",
            inputSchema: z.object({
              campaign_ids: z
                .array(z.string().regex(/^\d+$/))
                .min(1)
                .max(20),
            }),
          },
          async ({ campaign_ids }) => {
            try {
              const { loginCustomerId, customerId } = getGoogleAdsConfig();
              const uniqueCampaignIds = [...new Set(campaign_ids.map((id) => id.trim()))];
              const numericCampaignIds = uniqueCampaignIds.map((id) => {
                if (!/^\d+$/.test(id)) throw new Error(`Invalid campaign ID: ${id}`);
                return id;
              });

              const clientRows = await googleAdsSearchCustomer(
                loginCustomerId,
                `
                  SELECT customer_client.id, customer_client.descriptive_name,
                    customer_client.manager, customer_client.level, customer_client.status
                  FROM customer_client
                  WHERE customer_client.level > 0
                `,
              );

              const clients = new Map<
                string,
                { customer_id: string; customer_name: string | null; level: number | null }
              >();

              for (const row of clientRows) {
                const client = row.customerClient;
                const id = String(client?.id ?? "");
                if (!/^\d{10}$/.test(id) || client?.manager === true) continue;
                clients.set(id, {
                  customer_id: id,
                  customer_name: client?.descriptiveName ?? null,
                  level: Number.isFinite(Number(client?.level)) ? Number(client.level) : null,
                });
              }

              if (!clients.has(customerId)) {
                clients.set(customerId, {
                  customer_id: customerId,
                  customer_name: null,
                  level: null,
                });
              }

              const matches: any[] = [];
              const unqueryableClients: any[] = [];
              const idsClause = numericCampaignIds.join(", ");

              for (const client of clients.values()) {
                try {
                  const rows = await googleAdsSearchCustomer(
                    client.customer_id,
                    `
                      SELECT campaign.id, campaign.name, campaign.status,
                        campaign.advertising_channel_type
                      FROM campaign
                      WHERE campaign.id IN (${idsClause})
                    `,
                  );

                  for (const row of rows) {
                    matches.push({
                      customer_id: client.customer_id,
                      customer_name: client.customer_name,
                      manager_level: client.level,
                      campaign: row.campaign,
                    });
                  }
                } catch (error) {
                  unqueryableClients.push({
                    customer_id: client.customer_id,
                    customer_name: client.customer_name,
                    manager_level: client.level,
                    error: error instanceof Error ? error.message : String(error),
                  });
                }
              }

              const matchedIds = new Set(matches.map((match) => String(match.campaign?.id ?? "")));
              return toolResult({
                manager_customer_id: loginCustomerId,
                configured_customer_id: customerId,
                requested_campaign_ids: uniqueCampaignIds,
                client_accounts_considered: clients.size,
                matches,
                unmatched_campaign_ids: uniqueCampaignIds.filter((id) => !matchedIds.has(id)),
                unqueryable_clients: unqueryableClients,
                read_only: true,
              });
            } catch (error) {
              return toolError(error);
            }
          },
        );

'''

          text = text[:insert_at] + tool + text[insert_at:]
          path.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "Add read-only cross-manager Google Ads campaign lookup"
          git push origin HEAD:fix/google-ads-cross-manager-campaign-lookup
