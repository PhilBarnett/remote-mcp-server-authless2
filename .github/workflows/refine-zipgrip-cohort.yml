name: Refine ZipGrip sample cohort

on:
  push:
    branches:
      - feature/zipgrip-sample-cohort
    paths:
      - scripts/refine-zipgrip-cohort.mjs
      - .github/workflows/refine-zipgrip-cohort.yml

permissions:
  contents: write

jobs:
  refine-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zipgrip-sample-cohort
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/refine-zipgrip-cohort.mjs
      - run: npm run type-check
      - name: Remove temporary refinement machinery
        run: rm -f scripts/refine-zipgrip-cohort.mjs .github/workflows/refine-zipgrip-cohort.yml package-lock.json
      - name: Commit refined source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine ZipGrip cohort timing and value logic"
          git push origin HEAD:feature/zipgrip-sample-cohort
