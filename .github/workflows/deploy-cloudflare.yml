name: Deploy Blindmotion Business MCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blindmotion-business-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Type-check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save "@oxlint/binding-linux-x64-gnu@$(node -p "require('./node_modules/oxlint/package.json').version")"

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Enforce MCP tool ceiling
        run: npm run audit:mcp-tools -- --max 95

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
